<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mónaco Maitencillo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      background: #0a0a0a; color: #e5e5e5;
    }

    /* ── Hero ── */
    .hero {
      position: relative; flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh;
      background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
    }
    .hero::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(160deg,
        rgba(0,0,0,.75) 0%,
        rgba(0,0,0,.55) 50%,
        rgba(0,0,0,.72) 100%);
    }

    .hero-content {
      position: relative; z-index: 1;
      text-align: center; padding: 40px 24px;
      max-width: 680px; width: 100%;
    }

    .brand-label {
      font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
      color: rgba(255,255,255,.4); margin-bottom: 16px;
    }
    .brand-name {
      font-size: clamp(36px, 7vw, 64px); font-weight: 800;
      color: #fff; line-height: 1.1; margin-bottom: 8px;
      letter-spacing: -.5px;
    }
    .brand-name span { color: #ff5023; }
    .brand-sub {
      font-size: clamp(14px, 2.5vw, 17px); color: rgba(255,255,255,.45);
      margin-bottom: 56px; line-height: 1.5;
    }

    /* ── Cards ── */
    .cards {
      display: flex; gap: 16px; justify-content: center;
      flex-wrap: wrap;
    }

    .card {
      width: 240px; padding: 28px 24px 24px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      cursor: pointer; text-decoration: none;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      transition: transform .2s, background .2s, border-color .2s;
    }
    .card:hover {
      transform: translateY(-6px);
      background: rgba(255,255,255,.1);
      border-color: rgba(255,255,255,.2);
    }

    .card-icon {
      width: 56px; height: 56px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
    }
    .card-icon.admin   { background: linear-gradient(135deg,#7c6bc9,#9b8de0); }
    .card-icon.portal  { background: linear-gradient(135deg,#ff5023,#ff7849); }

    .card-title {
      font-size: 16px; font-weight: 700; color: #fff;
      text-align: center;
    }
    .card-desc {
      font-size: 12px; color: rgba(255,255,255,.4);
      text-align: center; line-height: 1.5;
    }
    .card-arrow {
      margin-top: 4px; font-size: 18px;
      color: rgba(255,255,255,.25);
      transition: color .2s, transform .2s;
    }
    .card:hover .card-arrow {
      color: rgba(255,255,255,.7);
      transform: translateX(4px);
    }

    /* ── Footer ── */
    .footer {
      position: absolute; bottom: 24px; left: 0; right: 0;
      text-align: center; z-index: 1;
    }
    .footer-text {
      font-size: 11px; color: rgba(255,255,255,.15);
      letter-spacing: .5px;
    }

    @media (max-width: 540px) {
      .cards { flex-direction: column; align-items: center; }
      .card  { width: 100%; max-width: 300px; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero-content">
      <div class="brand-label">Bienvenido a</div>
      <div class="brand-name">Mónaco <span>Maitencillo</span></div>
      <div class="brand-sub">Seleccioná cómo querés continuar</div>

      <div class="cards">
        <a href="/portal" class="card">
          <div class="card-icon portal">🍦</div>
          <div class="card-title">Portal de compras</div>
          <div class="card-desc">Realizá tu pedido de helados en línea</div>
          <div class="card-arrow">→</div>
        </a>
        <a href="/admin" class="card">
          <div class="card-icon admin">⚙️</div>
          <div class="card-title">Portal administrativo</div>
          <div class="card-desc">Acceso exclusivo para el equipo interno</div>
          <div class="card-arrow">→</div>
        </a>
      </div>
    </div>

    <div class="footer">
      <div class="footer-text">© 2026 Mónaco Maitencillo</div>
    </div>
  </div>
</body>
</html>
