<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de compras – Mónaco Maitencillo</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e5e5e5; min-height: 100vh; }

    /* ── LOGIN ── */
    #login-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .login-box {
      width: 100%; max-width: 380px;
      background: #141414; border: 1px solid #1f1f1f; border-radius: 16px;
      padding: 40px 36px;
    }
    .login-logo {
      font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 4px;
    }
    .login-logo span { color: #ff5023; }
    .login-sub {
      font-size: 13px; color: #444; margin-bottom: 32px;
    }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 11px; color: #555; margin-bottom: 7px; text-transform: uppercase; letter-spacing: .4px; }
    .field input {
      width: 100%; padding: 11px 14px; background: #0f0f0f;
      border: 1px solid #222; border-radius: 8px; color: #fff;
      font-size: 14px; outline: none; transition: border-color .2s;
    }
    .field input:focus { border-color: #ff5023; }
    .field input::placeholder { color: #333; }
    .btn-login {
      width: 100%; padding: 12px; background: #ff5023; color: #fff;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; margin-top: 6px; transition: opacity .15s;
    }
    .btn-login:hover { opacity: .88; }
    .btn-login:disabled { opacity: .4; cursor: not-allowed; }
    .login-error {
      background: #1a0a0a; border: 1px solid #3a1515; color: #f87171;
      padding: 10px 14px; border-radius: 8px; font-size: 13px;
      margin-top: 14px; display: none;
    }

    /* ── APP ── */
    #app { display: none; flex-direction: column; min-height: 100vh; }

    /* Top bar */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 12px;
      padding: 0 20px; height: 56px;
      background: #0f0f0f; border-bottom: 1px solid #1a1a1a;
      flex-shrink: 0;
    }
    .topbar-logo { font-size: 15px; font-weight: 700; color: #fff; flex: 1; }
    .topbar-logo span { color: #ff5023; }
    .topbar-user { font-size: 12px; color: #555; display: none; }
    @media (min-width: 480px) { .topbar-user { display: block; } }
    .btn-cart {
      background: #ff5023; border: none; color: #fff;
      padding: 8px 14px; border-radius: 8px; font-size: 13px;
      font-weight: 600; cursor: pointer; white-space: nowrap;
      transition: opacity .15s;
    }
    .btn-cart:hover { opacity: .88; }
    .btn-logout {
      background: transparent; border: 1px solid #222; color: #555;
      padding: 7px 12px; border-radius: 8px; font-size: 12px;
      cursor: pointer; transition: all .15s; white-space: nowrap;
    }
    .btn-logout:hover { border-color: #444; color: #aaa; }

    /* Nav tabs */
    .nav-tabs {
      display: flex; gap: 0; border-bottom: 1px solid #1a1a1a;
      background: #0f0f0f; flex-shrink: 0; padding: 0 20px;
    }
    .nav-tab {
      padding: 12px 18px; font-size: 13px; color: #555;
      background: transparent; border: none; border-bottom: 2px solid transparent;
      cursor: pointer; transition: all .15s;
    }
    .nav-tab.active { color: #fff; border-bottom-color: #ff5023; }

    /* Main content */
    .main-content { flex: 1; padding: 24px 20px 120px; max-width: 1100px; width: 100%; margin: 0 auto; }

    /* Catalog grid */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }
    @media (max-width: 480px) {
      .catalog-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    }

    .product-card {
      background: #141414; border: 1px solid #1f1f1f;
      border-radius: 12px; padding: 16px; display: flex;
      flex-direction: column; gap: 8px;
      transition: border-color .15s;
    }
    .product-card:hover { border-color: #2a2a2a; }
    .product-category {
      font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
      color: #444;
    }
    .product-name {
      font-size: 14px; font-weight: 600; color: #fff; line-height: 1.3;
      flex: 1;
    }
    .product-price {
      font-size: 16px; font-weight: 700; color: #ff5023;
    }
    .product-unit {
      font-size: 11px; color: #444; margin-top: -4px;
    }
    .qty-row {
      display: flex; align-items: center; gap: 8px; margin-top: 4px;
    }
    .qty-btn {
      width: 28px; height: 28px; border-radius: 6px;
      background: #1f1f1f; border: 1px solid #2a2a2a;
      color: #fff; font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s; flex-shrink: 0;
    }
    .qty-btn:hover { background: #2a2a2a; }
    .qty-num {
      min-width: 24px; text-align: center; font-size: 14px;
      font-weight: 600; color: #fff;
    }
    .btn-add-cart {
      width: 100%; padding: 9px; background: #1f1f1f;
      border: 1px solid #2a2a2a; border-radius: 8px;
      color: #aaa; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all .15s; margin-top: 4px;
    }
    .btn-add-cart:hover { background: #252525; color: #fff; border-color: #333; }
    .btn-add-cart.in-cart { background: #1a2a1a; border-color: #2d4d2d; color: #4ade80; }

    /* Floating cart bar */
    #cart-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #141414; border-top: 1px solid #1f1f1f;
      padding: 14px 20px; display: none;
      align-items: center; justify-content: space-between; gap: 12px;
      z-index: 200; flex-wrap: wrap;
    }
    #cart-bar.visible { display: flex; }
    .cart-bar-summary { font-size: 13px; color: #aaa; }
    .cart-bar-total { font-size: 16px; font-weight: 700; color: #fff; margin-top: 2px; }
    .btn-checkout {
      background: #ff5023; border: none; color: #fff;
      padding: 12px 24px; border-radius: 10px; font-size: 14px;
      font-weight: 600; cursor: pointer; transition: opacity .15s;
      white-space: nowrap;
    }
    .btn-checkout:hover { opacity: .88; }

    /* Orders list */
    .order-card {
      background: #141414; border: 1px solid #1f1f1f;
      border-radius: 12px; padding: 18px 20px; margin-bottom: 12px;
    }
    .order-header {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 12px; flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .order-date { font-size: 12px; color: #444; }
    .order-id { font-size: 11px; color: #333; }
    .order-total { font-size: 16px; font-weight: 700; color: #fff; }
    .order-items { font-size: 12px; color: #555; margin-top: 8px; padding-top: 10px; border-top: 1px solid #1a1a1a; }
    .badge {
      padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 500;
    }
    .badge-pendiente  { background: #2d1f00; color: #fbbf24; border: 1px solid #92400e; }
    .badge-confirmado { background: #0c1a2e; color: #60a5fa; border: 1px solid #1e40af; }
    .badge-entregado  { background: #0d2b1a; color: #4ade80; border: 1px solid #16532d; }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.75); z-index: 500;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal-panel {
      background: #141414; border: 1px solid #1f1f1f;
      border-radius: 16px; width: 100%; max-width: 520px;
      max-height: 90vh; overflow-y: auto;
      display: flex; flex-direction: column;
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 24px 16px; border-bottom: 1px solid #1f1f1f; flex-shrink: 0;
    }
    .modal-head h2 { font-size: 16px; font-weight: 700; color: #fff; }
    .modal-close-btn {
      background: transparent; border: none; color: #555;
      font-size: 22px; cursor: pointer; line-height: 1;
      transition: color .15s;
    }
    .modal-close-btn:hover { color: #aaa; }
    .modal-body { padding: 20px 24px; flex: 1; }
    .modal-footer {
      padding: 16px 24px; border-top: 1px solid #1f1f1f;
      display: flex; gap: 10px; flex-shrink: 0; flex-wrap: wrap;
    }

    .order-item-row {
      display: flex; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px solid #1a1a1a;
      font-size: 13px;
    }
    .order-item-row:last-child { border-bottom: none; }
    .order-item-name { color: #ccc; }
    .order-item-price { color: #fff; font-weight: 600; white-space: nowrap; }

    .order-total-row {
      display: flex; justify-content: space-between;
      padding: 14px 0 0;
      font-size: 15px; font-weight: 700; color: #fff;
    }

    .notes-label { font-size: 12px; color: #555; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 8px; margin-top: 16px; }
    textarea.notes-input {
      width: 100%; background: #0f0f0f; border: 1px solid #222;
      border-radius: 8px; color: #eee; padding: 10px 14px;
      font-size: 13px; resize: vertical; min-height: 72px;
      outline: none; font-family: inherit; transition: border-color .2s;
    }
    textarea.notes-input:focus { border-color: #ff5023; }

    .btn-wa {
      flex: 1; padding: 13px 20px; background: #25d366;
      border: none; color: #fff; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: opacity .15s; display: flex; align-items: center;
      justify-content: center; gap: 8px;
    }
    .btn-wa:hover { opacity: .88; }
    .btn-wa:disabled { opacity: .4; cursor: not-allowed; }
    .btn-cancel-modal {
      padding: 13px 20px; background: transparent;
      border: 1px solid #222; color: #555; border-radius: 10px;
      font-size: 14px; cursor: pointer; transition: all .15s;
    }
    .btn-cancel-modal:hover { border-color: #333; color: #aaa; }

    .success-banner {
      background: #0d2b1a; border: 1px solid #16532d;
      color: #4ade80; padding: 14px 18px; border-radius: 10px;
      font-size: 13px; text-align: center; margin-bottom: 20px;
      display: none;
    }
    .empty-state { color: #444; font-size: 13px; padding: 40px 0; text-align: center; }

    /* Loading spinner */
    .loading-text { color: #444; font-size: 13px; padding: 40px 0; text-align: center; }

    .catalog-search {
      margin-bottom: 20px;
    }
    .catalog-search input {
      width: 100%; max-width: 340px; padding: 10px 14px;
      background: #141414; border: 1px solid #1f1f1f;
      border-radius: 8px; color: #fff; font-size: 13px; outline: none;
      transition: border-color .2s;
    }
    .catalog-search input:focus { border-color: #ff5023; }
    .catalog-search input::placeholder { color: #333; }
  </style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Mónaco <span>Maitencillo</span></div>
    <div class="login-sub">Portal de compras</div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="tu@email.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn-login" id="login-btn" onclick="doLogin()">Ingresar</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ── APP ── -->
<div id="app">
  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-logo">Portal <span>de compras</span></div>
    <div class="topbar-user" id="topbar-user"></div>
    <button class="btn-cart" id="btn-cart-top" onclick="switchTab('catalogo')" style="display:none">
      Carrito (<span id="cart-count">0</span>)
    </button>
    <button class="btn-logout" onclick="doLogout()">Salir</button>
  </div>

  <!-- Nav tabs -->
  <div class="nav-tabs">
    <button class="nav-tab active" id="ntab-catalogo" onclick="switchTab('catalogo')">Catálogo</button>
    <button class="nav-tab" id="ntab-pedidos" onclick="switchTab('pedidos')">Mis Pedidos</button>
  </div>

  <!-- Main -->
  <div class="main-content">
    <div id="success-banner" class="success-banner"></div>

    <!-- Catalog view -->
    <div id="view-catalogo">
      <div class="catalog-search">
        <input type="text" id="catalog-search-input" placeholder="Buscar producto..." oninput="filterCatalog()">
      </div>
      <div id="catalog-grid" class="catalog-grid">
        <div class="loading-text">Cargando catálogo...</div>
      </div>
    </div>

    <!-- Orders view -->
    <div id="view-pedidos" style="display:none">
      <div id="orders-list">
        <div class="loading-text">Cargando pedidos...</div>
      </div>
    </div>
  </div>

  <!-- Floating cart bar -->
  <div id="cart-bar">
    <div>
      <div class="cart-bar-summary" id="cart-bar-summary"></div>
      <div class="cart-bar-total" id="cart-bar-total"></div>
    </div>
    <button class="btn-checkout" onclick="openCheckout()">Realizar pedido →</button>
  </div>
</div>

<!-- ── CHECKOUT MODAL ── -->
<div class="modal-overlay" id="checkout-modal" onclick="closeModalIfOutside(event)">
  <div class="modal-panel">
    <div class="modal-head">
      <h2>Confirmar pedido</h2>
      <button class="modal-close-btn" onclick="closeCheckout()">×</button>
    </div>
    <div class="modal-body">
      <div id="checkout-items"></div>
      <div class="notes-label">Notas (opcional)</div>
      <textarea class="notes-input" id="checkout-notes" placeholder="Ej: entregar por la tarde..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-wa" id="btn-confirm" onclick="confirmOrder()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Confirmar y enviar por WhatsApp
      </button>
      <button class="btn-cancel-modal" onclick="closeCheckout()">Cancelar</button>
    </div>
  </div>
</div>

<script>
// ── Firebase init ──────────────────────────────────────────
firebase.initializeApp({
  apiKey:            "AIzaSyClWXJOVHX6zDlX223KNSuiFNQkN2NvCuo",
  authDomain:        "fudo-2cfb7.firebaseapp.com",
  projectId:         "fudo-2cfb7",
  storageBucket:     "fudo-2cfb7.firebasestorage.app",
  messagingSenderId: "971726701752",
  appId:             "1:971726701752:web:233ed9958a4b908590204d"
});
const auth = firebase.auth();

// ── State ─────────────────────────────────────────────────
let catalogItems = [];
let cart = {}; // { productId: { item, quantity } }
let currentUser = null;
let currentView = 'catalogo';

// ── Helpers ───────────────────────────────────────────────
async function portalFetch(path, opts = {}) {
  const token = await firebase.auth().currentUser?.getIdToken();
  const res = await fetch(path, {
    ...opts,
    headers: {
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json',
      ...(opts.headers || {})
    }
  });
  return res;
}

function fmtPrice(n) {
  return '$' + Number(n).toLocaleString('es-CL');
}

function cartSize() {
  return Object.values(cart).reduce((s, v) => s + v.quantity, 0);
}

function cartTotal() {
  return Object.values(cart).reduce((s, v) => s + (v.item.currentPrice * v.quantity), 0);
}

// ── Auth ──────────────────────────────────────────────────
auth.onAuthStateChanged(async user => {
  if (!user) {
    showLogin();
    return;
  }
  // Verify buyer claim
  const token = await user.getIdTokenResult();
  if (token.claims.type !== 'buyer') {
    showLoginError('Acceso no autorizado. Esta cuenta no tiene acceso al portal de compras.');
    await auth.signOut();
    return;
  }
  currentUser = user;
  showApp(user);
});

function showLogin() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

function showLoginError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display = 'block';
  const btn = document.getElementById('login-btn');
  btn.disabled = false;
  btn.textContent = 'Ingresar';
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const err   = document.getElementById('login-error');
  const btn   = document.getElementById('login-btn');
  err.style.display = 'none';
  if (!email || !pass) { err.textContent = 'Ingresa email y contraseña'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Ingresando...';
  try {
    await auth.signInWithEmailAndPassword(email, pass);
  } catch(e) {
    const msg = e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found'
      ? 'Email o contraseña incorrectos'
      : e.message;
    showLoginError(msg);
  }
}

async function doLogout() {
  await auth.signOut();
  cart = {};
  catalogItems = [];
  showLogin();
}

function showApp(user) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  const name = user.displayName || user.email.split('@')[0];
  document.getElementById('topbar-user').textContent = name;
  document.getElementById('btn-cart-top').style.display = 'flex';
  loadCatalog();
}

// ── Tabs ──────────────────────────────────────────────────
function switchTab(tab) {
  currentView = tab;
  document.getElementById('ntab-catalogo').classList.toggle('active', tab === 'catalogo');
  document.getElementById('ntab-pedidos').classList.toggle('active',  tab === 'pedidos');
  document.getElementById('view-catalogo').style.display = tab === 'catalogo' ? 'block' : 'none';
  document.getElementById('view-pedidos').style.display  = tab === 'pedidos'  ? 'block' : 'none';
  if (tab === 'pedidos') loadOrders();
}

// ── Catalog ───────────────────────────────────────────────
async function loadCatalog() {
  const gridEl = document.getElementById('catalog-grid');
  gridEl.innerHTML = '<div class="loading-text">Cargando catálogo...</div>';
  try {
    const res  = await portalFetch('/api/portal/catalog');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    catalogItems = data.catalog || [];
    renderCatalog(catalogItems);
  } catch(e) {
    gridEl.innerHTML = `<div class="loading-text" style="color:#f87171">${e.message}</div>`;
  }
}

function filterCatalog() {
  const q = document.getElementById('catalog-search-input').value.toLowerCase();
  const filtered = q ? catalogItems.filter(p =>
    p.name.toLowerCase().includes(q) || (p.category || '').toLowerCase().includes(q)
  ) : catalogItems;
  renderCatalog(filtered);
}

function renderCatalog(items) {
  const gridEl = document.getElementById('catalog-grid');
  if (!items.length) {
    gridEl.innerHTML = '<div class="empty-state">Sin productos disponibles.</div>';
    return;
  }
  gridEl.innerHTML = items.map(p => {
    const qty = cart[p.id]?.quantity || 0;
    const inCart = qty > 0;
    return `
    <div class="product-card" id="pc-${p.id}">
      <div class="product-category">${p.category || ''}</div>
      <div class="product-name">${p.name}</div>
      <div class="product-price">${fmtPrice(p.currentPrice)}</div>
      <div class="product-unit">por ${p.unit || 'unidad'}</div>
      <div class="qty-row">
        <button class="qty-btn" onclick="changeQty('${p.id}',-1)">−</button>
        <div class="qty-num" id="qty-${p.id}">${qty}</div>
        <button class="qty-btn" onclick="changeQty('${p.id}',1)">+</button>
      </div>
      <button class="btn-add-cart ${inCart ? 'in-cart' : ''}" id="addBtn-${p.id}"
        onclick="addToCart('${p.id}')">
        ${inCart ? '✓ En carrito' : 'Agregar'}
      </button>
    </div>`;
  }).join('');
}

function changeQty(productId, delta) {
  const item = catalogItems.find(p => p.id === productId);
  if (!item) return;
  const current = cart[productId]?.quantity || 0;
  const newQty = Math.max(0, current + delta);
  const qtyEl = document.getElementById(`qty-${productId}`);
  if (qtyEl) qtyEl.textContent = newQty;
  if (newQty === 0) {
    delete cart[productId];
  } else {
    cart[productId] = { item, quantity: newQty };
  }
  updateAddBtn(productId);
  updateCartBar();
}

function addToCart(productId) {
  const item = catalogItems.find(p => p.id === productId);
  if (!item) return;
  const current = cart[productId]?.quantity || 0;
  if (current === 0) {
    cart[productId] = { item, quantity: 1 };
    const qtyEl = document.getElementById(`qty-${productId}`);
    if (qtyEl) qtyEl.textContent = 1;
  } else {
    delete cart[productId];
    const qtyEl = document.getElementById(`qty-${productId}`);
    if (qtyEl) qtyEl.textContent = 0;
  }
  updateAddBtn(productId);
  updateCartBar();
}

function updateAddBtn(productId) {
  const btn = document.getElementById(`addBtn-${productId}`);
  if (!btn) return;
  const inCart = (cart[productId]?.quantity || 0) > 0;
  btn.className = `btn-add-cart ${inCart ? 'in-cart' : ''}`;
  btn.textContent = inCart ? '✓ En carrito' : 'Agregar';
}

function updateCartBar() {
  const size  = cartSize();
  const total = cartTotal();
  const bar   = document.getElementById('cart-bar');
  const countEl = document.getElementById('cart-count');
  if (countEl) countEl.textContent = size;

  if (size === 0) {
    bar.classList.remove('visible');
    return;
  }
  bar.classList.add('visible');
  document.getElementById('cart-bar-summary').textContent = `${size} producto${size !== 1 ? 's' : ''} en el carrito`;
  document.getElementById('cart-bar-total').textContent = `Total: ${fmtPrice(total)}`;
}

// ── Checkout modal ────────────────────────────────────────
function openCheckout() {
  const items = Object.values(cart);
  if (!items.length) return;
  const total = cartTotal();

  const itemsHtml = items.map(({ item, quantity }) => `
    <div class="order-item-row">
      <span class="order-item-name">${quantity}× ${item.name}</span>
      <span class="order-item-price">${fmtPrice(item.currentPrice * quantity)}</span>
    </div>`).join('');

  document.getElementById('checkout-items').innerHTML = `
    ${itemsHtml}
    <div class="order-total-row">
      <span>Total</span>
      <span>${fmtPrice(total)}</span>
    </div>`;
  document.getElementById('checkout-notes').value = '';
  document.getElementById('checkout-modal').classList.add('open');
}

function closeCheckout() {
  document.getElementById('checkout-modal').classList.remove('open');
}

function closeModalIfOutside(e) {
  if (e.target === document.getElementById('checkout-modal')) closeCheckout();
}

async function confirmOrder() {
  const btn   = document.getElementById('btn-confirm');
  const notes = document.getElementById('checkout-notes').value.trim();
  const items = Object.values(cart).map(({ item, quantity }) => ({
    productId: item.id,
    name:      item.name,
    price:     item.currentPrice,
    unit:      item.unit || 'unidad',
    quantity
  }));

  btn.disabled = true;
  btn.textContent = 'Enviando...';

  try {
    const res  = await portalFetch('/api/portal/orders', {
      method: 'POST',
      body:   JSON.stringify({ items, notes })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    const { id, waNumber } = data;
    const userName = currentUser?.displayName || currentUser?.email || 'Cliente';
    const now = new Date();
    const dateStr = now.toLocaleDateString('es-CL') + ' ' + now.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });

    const detalle = items.map(i => `• ${i.quantity}x ${i.name} — ${fmtPrice(i.price * i.quantity)}`).join('\n');
    const totalStr = fmtPrice(items.reduce((s, i) => s + i.price * i.quantity, 0));
    const shortId = id.substring(0, 6);

    const waMsg = `🛒 *Nuevo pedido*\n👤 *Cliente:* ${userName}\n\n📋 *Detalle:*\n${detalle}\n\n💰 *Total: ${totalStr}*\n\n📝 *Notas:* ${notes || 'Sin notas'}\n\n_Pedido #${shortId} · ${dateStr}_`;

    const waUrl = `https://wa.me/${waNumber}?text=${encodeURIComponent(waMsg)}`;
    window.open(waUrl, '_blank');

    closeCheckout();
    cart = {};
    updateCartBar();
    // Re-render catalog to clear cart state
    renderCatalog(catalogItems.filter(p => {
      const q = document.getElementById('catalog-search-input')?.value.toLowerCase() || '';
      return !q || p.name.toLowerCase().includes(q) || (p.category || '').toLowerCase().includes(q);
    }));

    const banner = document.getElementById('success-banner');
    banner.textContent = `✓ Pedido #${shortId} enviado correctamente. Se abrió WhatsApp para confirmar.`;
    banner.style.display = 'block';
    setTimeout(() => { banner.style.display = 'none'; }, 8000);

  } catch(e) {
    alert('Error al enviar el pedido: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg> Confirmar y enviar por WhatsApp`;
  }
}

// ── Orders ────────────────────────────────────────────────
async function loadOrders() {
  const listEl = document.getElementById('orders-list');
  listEl.innerHTML = '<div class="loading-text">Cargando pedidos...</div>';
  try {
    const res  = await portalFetch('/api/portal/orders');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    renderOrders(data.orders || []);
  } catch(e) {
    listEl.innerHTML = `<div class="loading-text" style="color:#f87171">${e.message}</div>`;
  }
}

function renderOrders(orders) {
  const listEl = document.getElementById('orders-list');
  if (!orders.length) {
    listEl.innerHTML = '<div class="empty-state">Sin pedidos aún.<br><br><button onclick="switchTab(\'catalogo\')" style="background:#ff5023;border:none;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600">Ver catálogo</button></div>';
    return;
  }
  const badgeClass = s => s === 'pendiente' ? 'badge-pendiente' : s === 'confirmado' ? 'badge-confirmado' : 'badge-entregado';
  const badgeLabel = s => s === 'pendiente' ? 'Pendiente' : s === 'confirmado' ? 'Confirmado' : s === 'entregado' ? 'Entregado' : s;

  listEl.innerHTML = orders.map(o => `
    <div class="order-card">
      <div class="order-header">
        <div>
          <div class="order-date">${(o.createdAt || '').substring(0, 16).replace('T', ' ')}</div>
          <div class="order-id">Pedido #${o.id.substring(0, 6)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span class="badge ${badgeClass(o.status)}">${badgeLabel(o.status)}</span>
          <span class="order-total">${fmtPrice(o.total)}</span>
        </div>
      </div>
      <div class="order-items">
        ${(o.items || []).map(i => `${i.quantity}× ${i.name}`).join(' · ')}
        ${o.notes ? `<div style="margin-top:6px;font-style:italic;color:#444">📝 ${o.notes}</div>` : ''}
      </div>
    </div>`).join('');
}
</script>
